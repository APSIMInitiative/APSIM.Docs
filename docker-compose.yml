services:
  apsim-docs:
    image: apsimdocs
    # pull_policy: always
    container_name: apsim-docs
    restart: unless-stopped
    networks:
      - apsim
    ports:
      - "8080:8080"
    volumes:
      - /data/apsim-docs/:/app/apsim-docs-html
      - /data/apsim-docs-md/:/app/apsim-docs-md
networks:
  apsim:
    external: false
